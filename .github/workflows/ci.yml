name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --project-name groupbuy --platforms=android,ios,web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
